[project]
name = "pulsecheck"
version = "0.1.0"
description = "Uptime-monitoring API with a production-grade delivery pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ibrahim Jamli" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "httpx>=0.27,<1.0",
    "prometheus-client>=0.21,<1.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30,<1.0"]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=6.0,<8.0",
    "respx>=0.21,<1.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "ASYNC"]
# FastAPI's dependency-injection idiom is `param = Depends(...)` in the
# signature, which B008 flags as a call in a default argument. It is correct
# here, so the rule is disabled rather than worked around.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Asserting on a possibly-None error string is the point of these tests.
"tests/*" = ["B011"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --cov=app --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
omit = ["app/__main__.py"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
