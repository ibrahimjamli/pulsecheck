# Local development stack: the API against a real Postgres, plus Prometheus
# scraping it. Brought up with `make up`.
services:
  api:
    build:
      context: .
      args:
        VERSION: dev
    image: pulsecheck:dev
    environment:
      PULSECHECK_DATABASE_URL: postgresql+asyncpg://pulsecheck:pulsecheck@db:5432/pulsecheck
      PULSECHECK_ENVIRONMENT: compose
      PULSECHECK_LOG_LEVEL: DEBUG
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulsecheck
      POSTGRES_PASSWORD: pulsecheck
      POSTGRES_DB: pulsecheck
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The API waits on this, so it never races the database on a cold start.
      test: ["CMD-SHELL", "pg_isready -U pulsecheck -d pulsecheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

volumes:
  pgdata:
