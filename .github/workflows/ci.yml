name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run instead of queueing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types and tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: mypy
        run: mypy app

      - name: pytest
        run: pytest

      - name: Enforce coverage floor
        run: coverage report --fail-under=85

      - name: Upload coverage artefact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  image:
    name: Build and scan image
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build (load into the local daemon so it can be scanned)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pulsecheck:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: pulsecheck:ci
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Publish scan results to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Fail the build on a fixable HIGH or CRITICAL CVE
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: pulsecheck:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate an SBOM
        uses: anchore/sbom-action@v0
        with:
          image: pulsecheck:ci
          format: spdx-json
          artifact-name: pulsecheck-sbom.spdx.json

      - name: Smoke-test the container
        run: |
          docker run -d --name smoke -p 8000:8000 pulsecheck:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/healthz > /dev/null; then
              echo "container answered after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::container never became healthy"
              docker logs smoke
              exit 1
            fi
            sleep 1
          done
          curl -fs http://localhost:8000/healthz | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fs http://localhost:8000/metrics | grep -q pulsecheck_http_requests_total
          echo "Image runs as UID: $(docker exec smoke id -u)"
          test "$(docker exec smoke id -u)" = "10001"
          docker rm -f smoke

  kubernetes:
    name: Deploy to an ephemeral cluster
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: |
          docker build -t pulsecheck:dev \
            --build-arg VERSION=ci-${{ github.sha }} \
            --build-arg VCS_REF=${{ github.sha }} .

      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: pulsecheck
          config: deploy/kind-config.yaml

      - name: Load the image into the cluster
        run: kind load docker-image pulsecheck:dev --name pulsecheck

      - name: Validate the manifests before applying
        run: kubectl apply -k deploy/k8s --dry-run=server

      - name: Apply
        run: kubectl apply -k deploy/k8s

      - name: Wait for the rollout
        run: kubectl -n pulsecheck rollout status deploy/pulsecheck --timeout=180s

      - name: Smoke-test through the Service
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:30080/healthz > /dev/null; then break; fi
            [ "$i" -eq 30 ] && { kubectl -n pulsecheck describe pods; exit 1; }
            sleep 2
          done
          curl -fs http://localhost:30080/healthz | grep -q '"environment":"kubernetes"'
          curl -fs -X POST http://localhost:30080/api/v1/monitors \
            -H 'content-type: application/json' \
            -d '{"name":"github","url":"https://github.com"}' | grep -q '"id"'
          curl -fs http://localhost:30080/api/v1/monitors | grep -q github
          echo "API served real traffic inside Kubernetes"

      - name: Prove the rollout is zero-downtime
        run: |
          # Restart while polling: maxUnavailable=0 plus a readiness gate should
          # mean not one request is dropped.
          kubectl -n pulsecheck rollout restart deploy/pulsecheck
          failures=0
          for _ in $(seq 1 60); do
            curl -fs http://localhost:30080/healthz > /dev/null || failures=$((failures+1))
            sleep 0.5
          done
          kubectl -n pulsecheck rollout status deploy/pulsecheck --timeout=180s
          echo "requests failed during rollout: $failures"
          test "$failures" -eq 0

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n pulsecheck get all
          kubectl -n pulsecheck describe pods
          kubectl -n pulsecheck logs -l app.kubernetes.io/name=pulsecheck --tail=100 || true
