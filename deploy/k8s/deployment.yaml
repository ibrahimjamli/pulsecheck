apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsecheck
  namespace: pulsecheck
  labels:
    app.kubernetes.io/name: pulsecheck
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pulsecheck
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never drop below the current capacity during a rollout
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulsecheck
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # Long enough for the preStop sleep plus a slow in-flight request.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: pulsecheck:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: pulsecheck-config
          # Liveness restarts a wedged process; readiness only removes the pod
          # from the Service, which is what a transient database blip warrants.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Endpoint removal and SIGTERM happen together, but kube-proxy takes a
          # moment to rewrite the node's iptables rules. Without this pause the
          # rollout drops the requests still being routed to a terminating pod.
          # The CI job restarts the deployment under load and fails on a single
          # dropped request, which is how this was found.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem means anything that writes needs an explicit
        # writable mount; these two are all the app actually needs.
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
