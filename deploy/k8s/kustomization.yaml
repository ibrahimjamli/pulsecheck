apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pulsecheck
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - poddisruptionbudget.yaml
# `labels` rather than the deprecated `commonLabels`: includeSelectors stays
# false so these never leak into the Deployment selector, which is immutable
# once created.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: pulsecheck
